specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  # =============================================================================
  # FIXED: Participation Contract
  # =============================================================================
  - kind: ethereum/contract
    name: Participation
    network: local
    source:
      address: "0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9"
      abi: Participation
      startBlock: 0  # ✅ Set to actual deployment block (not 1)
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Node
        - Reward
        - Stake
        - Uptime
      abis:
        - name: Participation
          file: ./abis/Participation.json
      eventHandlers:
        - event: NodeRegistered(indexed uint256,indexed address,uint256)
          handler: handleNodeRegistered
        - event: RewardClaimed(indexed uint256,indexed address,uint256,uint256)
          handler: handleRewardClaimed
        - event: StakeUpdated(indexed uint256,indexed address,uint256,uint256)
          handler: handleStakeUpdated
        - event: UptimeRecorded(indexed uint256,uint256,uint256)
          handler: handleUptimeRecorded
      file: ./src/mapping.ts

  # =============================================================================
  # FIXED: StakingPool Contract
  # =============================================================================
  - kind: ethereum/contract
    name: StakingPool
    network: local
    source:
      address: "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
      abi: StakingPool
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - PoolStake
        - StakeWithdrawal
        - RewardClaim
        - PoolConfig
        - GlobalStats
      abis:
        - name: StakingPool
          file: ./abis/StakingPool.json
      eventHandlers:
        - event: PoolStaked(indexed address,indexed uint256,uint8,uint8,uint256,uint256)
          handler: handlePoolStaked
        - event: StakeWithdrawn(indexed address,indexed uint256,uint256,uint256)
          handler: handleStakeWithdrawn
        - event: RewardsClaimed(indexed address,indexed uint256,uint256,uint256)
          handler: handleRewardsClaimed
        - event: PoolConfigUpdated(uint8,uint256,uint256,uint256)
          handler: handlePoolConfigUpdated
        - event: EmergencyWithdraw(indexed address,uint256)
          handler: handleEmergencyWithdraw
      file: ./src/mapping.ts

  # =============================================================================
  # FIXED: NodeRightsNFT Contract
  # =============================================================================
  - kind: ethereum/contract
    name: NodeRightsNFT
    network: local
    source:
      address: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
      abi: NodeRightsNFT
      startBlock: 3
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - NodeRights
        - NodeUpgrade
        - PerformanceUpdate
        - NodeSlashing
        - CrossChainBridge
        - RewardDistribution
      abis:
        - name: NodeRightsNFT
          file: ./abis/NodeRightsNFT.json
      eventHandlers:
        - event: NodeRightsMinted(indexed uint256,indexed address,uint8,uint256,uint256)
          handler: handleNodeRightsMinted
        - event: NodeUpgraded(indexed uint256,uint256,uint256,uint256)
          handler: handleNodeUpgraded
        - event: PerformanceUpdated(indexed uint256,uint256,uint256,uint8)
          handler: handlePerformanceUpdated
        - event: NodeSlashed(indexed uint256,uint8,uint256,string)
          handler: handleNodeSlashed
        - event: CrossChainBridge(indexed uint256,string,address)
          handler: handleCrossChainBridge
        - event: RewardsDistributed(indexed uint256,uint256,uint256)
          handler: handleRewardsDistributed
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleNFTTransfer
      file: ./src/mapping.ts

  # =============================================================================
  # FIXED: DPNToken Contract
  # =============================================================================
  - kind: ethereum/contract
    name: DPNToken
    network: local
    source:
      address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      abi: DPNToken
      startBlock: 3  # ✅ Set to actual deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - TokenTransfer
        - TokenBalance
      abis:
        - name: DPNToken
          file: ./abis/DPNToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleDPNTransfer
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleDPNApproval
      file: ./src/mapping.ts

  # =============================================================================
  # FIXED: NodeRegistry Contract
  # =============================================================================
  - kind: ethereum/contract
    name: NodeRegistry
    network: local
    source:
      address: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
      abi: NodeRegistry
      startBlock: 3
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - RegisteredNode
        - NodeStatusChange
      abis:
        - name: NodeRegistry
          file: ./abis/NodeRegistry.json
      eventHandlers:
        - event: NodeRegistered(indexed uint256,indexed address,uint256)
          handler: handleNodeRegistryRegistered
      file: ./src/mapping.ts